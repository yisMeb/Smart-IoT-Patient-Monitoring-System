name: Deploy backend to EC2

on:
  push:
    branches:
      - main
    paths:
      - "backend/**"
      - ".github/workflows/deploy-backend.yml"
  workflow_dispatch:

concurrency:
  group: production-backend
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Validate and deploy
    runs-on: ubuntu-latest
    environment: production
    env:
      EC2_HOST: ${{ secrets.EC2_HOST }}
      EC2_USER: ${{ secrets.EC2_USER }}
      EC2_PORT: ${{ secrets.EC2_PORT }}
      EC2_SSH_PRIVATE_KEY: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
      EC2_KNOWN_HOSTS: ${{ secrets.EC2_KNOWN_HOSTS }}
      EC2_APP_DIR: ${{ secrets.EC2_APP_DIR }}
      EC2_SERVICE_NAME: ${{ secrets.EC2_SERVICE_NAME }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate backend Python files
        run: python -m compileall -q backend/app

      - name: Validate deployment secrets
        shell: bash
        run: |
          required=(
            EC2_HOST
            EC2_USER
            EC2_PORT
            EC2_SSH_PRIVATE_KEY
            EC2_KNOWN_HOSTS
            EC2_APP_DIR
            EC2_SERVICE_NAME
          )

          for name in "${required[@]}"; do
            if [[ -z "${!name}" ]]; then
              echo "Missing required production secret: ${name}" >&2
              exit 1
            fi
          done

      - name: Configure SSH
        shell: bash
        run: |
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$EC2_SSH_PRIVATE_KEY" > "$HOME/.ssh/ec2_deploy_key"
          printf '%s\n' "$EC2_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/ec2_deploy_key" "$HOME/.ssh/known_hosts"

      - name: Package backend
        shell: bash
        run: |
          tar \
            --exclude='__pycache__' \
            --exclude='*.pyc' \
            -czf "$RUNNER_TEMP/backend-${GITHUB_SHA}.tar.gz" \
            backend

      - name: Upload backend to EC2
        shell: bash
        run: |
          scp \
            -P "$EC2_PORT" \
            -i "$HOME/.ssh/ec2_deploy_key" \
            "$RUNNER_TEMP/backend-${GITHUB_SHA}.tar.gz" \
            "$EC2_USER@$EC2_HOST:/tmp/backend-${GITHUB_SHA}.tar.gz"

      - name: Install and restart backend
        shell: bash
        run: |
          ssh \
            -p "$EC2_PORT" \
            -i "$HOME/.ssh/ec2_deploy_key" \
            "$EC2_USER@$EC2_HOST" \
            bash -s -- \
            "$EC2_APP_DIR" \
            "$EC2_SERVICE_NAME" \
            "/tmp/backend-${GITHUB_SHA}.tar.gz" <<'REMOTE'
          set -euo pipefail

          app_dir="$1"
          service_name="$2"
          archive="$3"

          mkdir -p "$app_dir"
          tar -xzf "$archive" -C "$app_dir" --strip-components=1
          rm -f "$archive"

          python3 -m venv "$app_dir/.venv"
          "$app_dir/.venv/bin/pip" install --upgrade pip
          "$app_dir/.venv/bin/pip" install -r "$app_dir/requirements.txt"

          sudo systemctl restart "$service_name"
          sudo systemctl is-active --quiet "$service_name"
          REMOTE

