name: FastAPI CI/CD

on:
  push:
    branches: 
      - main 

jobs:

  CI:
    runs-on: ubuntu-latest
    steps:   
      - uses: actions/checkout@v2
      
      - name: Set up Python
        uses: actions/setup-python@v2
        with:
          python-version: 3.12.4

      - name: Install Python Virtual ENV
        run: pip3 install virtualenv

      - name: Virtual ENV
        uses: actions/cache@v2
        id: cache-venv 
        with:
          path: venv 
          key: ${{ runner.os }}-venv-${{ hashFiles('backend/requirements*.txt') }}
          restore-keys: |
            ${{ runner.os }}-venv-

      - name: Activate Virtual ENV
        run: python -m venv venv && source venv/bin/activate && pip3 install -r backend/requirements.txt
        if: steps.cache-venv.outputs.cache-hit != 'true'

      - name: List files in tests directory
        run: ls backend/tests

      - name: Run Tests   
        run: . venv/bin/activate && pytest backend/tests

      - name: Create archive of dependencies
        run: |
          cd ./venv/lib/python3.12/site-packages
          zip -r9 ../../../../api.zip .
      
      - name: Add API files to Zip file
        run: cd /backend/app/api && zip -g ../../../api.zip -r .

      - name: Upload zip file artifact
        uses: actions/upload-artifact@v3 
        with:
          name: api
          path: api.zip